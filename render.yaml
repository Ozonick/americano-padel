services:
  - type: web
    name: americano-padel
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn server:app --host 0.0.0.0 --port $PORT
    envVars:
      # Las contraseñas NO van en este archivo (el repo es público).
      # Se cargan a mano en Render → tu servicio → Environment.
      - key: ADMIN_PASSWORD
        sync: false
      - key: TORNEO_PASSWORD
        sync: false
      - key: DB_PATH
        value: /data/torneo.db
      - key: PYTHON_VERSION
        value: 3.12.8
    disk:
      name: db
      mountPath: /data
      sizeGB: 1
